<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lockCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="240" rx="16" fill="#f0f9ff"/>

  <!-- 3D Box Shadow -->
  <g filter="url(#shadow)">
    <!-- Side Face (Left side of 3D box) -->
    <polygon points="75,45 110,30 110,195 75,205" fill="url(#boxSide)"/>
    <text x="82" y="120" font-family="'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#f59e0b" transform="rotate(-78, 88, 120)" letter-spacing="1">UNLOCK TOOL</text>

    <!-- Top Face -->
    <polygon points="75,45 110,30 205,30 170,45" fill="url(#boxTop)"/>

    <!-- Front Face -->
    <polygon points="110,30 205,30 205,195 110,195" fill="url(#boxFront)"/>

    <!-- Front Face Content -->
    <!-- Title bar on box -->
    <rect x="118" y="42" width="79" height="18" rx="3" fill="#0f172a"/>
    <text x="157" y="54" font-family="'Arial Black', sans-serif" font-size="8" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="0.5">UNLOCK TOOL</text>

    <!-- Central Lock Ring -->
    <circle cx="157" cy="115" r="28" fill="#0f172a" stroke="#fef08a" stroke-width="2.5"/>
    <circle cx="157" cy="115" r="22" fill="url(#lockCircle)"/>

    <!-- Padlock Icon inside circle -->
    <!-- Shackle -->
    <path d="M 151,110 V 104 C 151,100.5 153.5,98 157,98 C 160.5,98 163,100.5 163,104 V 110" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="148" y="109" width="18" height="14" rx="2.5" fill="#ffffff"/>
    <!-- Keyhole -->
    <circle cx="157" cy="115" r="2" fill="#ea580c"/>
    <path d="M 156.2,115 L 157.8,115 L 158.5,119.5 L 155.5,119.5 Z" fill="#ea580c"/>

    <!-- Bottom Accent Lines on Box -->
    <line x1="118" y1="175" x2="197" y2="175" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="118" y1="181" x2="197" y2="181" stroke="#0f172a" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
